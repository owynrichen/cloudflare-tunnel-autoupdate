name: Validate YAML

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install YAML tools
        run: |
          python -m pip install --upgrade pip
          pip install uv PyYAML yamllint
      - name: Validate YAML files (syntax + lint)
        run: |
          set -euo pipefail
          files=$(git ls-files '*.yml' '*.yaml' || true)
          if [ -z "$files" ]; then
            echo "No YAML files to validate"
            exit 0
          fi
          echo "Validating YAML files:"
          echo "$files"
          for f in $files; do
            echo "Checking syntax: $f"
            uv run -- python -c "import sys,yaml; yaml.safe_load(open(sys.argv[1])); print(sys.argv[1]+': OK')" "$f"
          done
          echo "Running yamllint..."
          echo "$files" | xargs -r yamllint -f parsable
