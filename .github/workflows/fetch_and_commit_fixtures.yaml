name: Fetch, Sanitize, and Commit Fixtures

on:
  workflow_dispatch: {}
  # Temporarily allow runs on push to main so we can immediately execute the updated workflow
  # (this is minimal and can be removed after verification)
  push:
    branches:
      - main

jobs:
  fetch-and-commit:
    name: Fetch -> Sanitize -> Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_USER_NAME: "proxcloud-bot"
      GIT_USER_EMAIL: "proxcloud-bot@example.com"
      # Prefer a user PAT for PR creation if provided; fall back to the workflow GITHUB_TOKEN
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML python-dotenv

      - name: Fetch fixtures
        run: |
          mkdir -p tmp/raw tmp/sanitized
          python scripts/fetch_production_fixtures.py --output tmp/raw

      - name: Sanitize fixtures
        run: |
          python scripts/sanitize_fixtures.py --input tmp/raw --output tmp/sanitized

      - name: Commit sanitized fixtures and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          BRANCH="fixtures-update-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          rsync -a --delete tmp/sanitized/ tests/production_fixtures/
          git add tests/production_fixtures/
          if git diff --cached --quiet; then
            echo "No changes to fixtures"
            exit 0
          fi
          git commit -m "Update sanitized fixtures"
          # ensure we push using the provided GITHUB_TOKEN
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push --set-upstream origin "$BRANCH"

          # Create a pull request via the GitHub REST API. Prefer PERSONAL_ACCESS_TOKEN if set,
          # otherwise fall back to GITHUB_TOKEN (may be blocked by repo policy).
          echo "Creating PR against main from $BRANCH"
      - name: Create PR via REST API (use PAT if present)
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: fixtures-update-${{ github.run_id }}
        run: |
          set -euo pipefail
          # Prefer a user PAT when available
          TOKEN="${PERSONAL_ACCESS_TOKEN:-$GITHUB_TOKEN}"
          echo "Using token starting with: ${TOKEN:0:4}***"
          REPO="$GITHUB_REPOSITORY"
          TITLE="Update sanitized fixtures (${BRANCH})"
          BODY="Automated update of sanitized fixtures from workflow run $GITHUB_RUN_ID. Please review before merging."
          API_URL="https://api.github.com/repos/${REPO}/pulls"

          DATA=$(printf '{"title":"%s","head":"%s","base":"main","body":"%s"}' "$TITLE" "$BRANCH" "$BODY")

          resp=$(curl -sS -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github.v3+json" -d "$DATA" "$API_URL" || true)

          # Attempt to extract html_url from response using jq (safer in YAML)
          pr_url=$(echo "$resp" | jq -r '.html_url // empty' || true)

          if [ -z "$pr_url" ]; then
            echo "Failed to create PR. Full response:" >&2
            echo "$resp" >&2
            exit 1
          fi

          echo "Created PR: $pr_url"
