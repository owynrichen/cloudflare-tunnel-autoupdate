name: Fetch, Sanitize, and Commit Fixtures

on:
  workflow_dispatch: {}

jobs:
  fetch-and-commit:
    name: Fetch -> Sanitize -> Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_USER_NAME: "proxcloud-bot"
      GIT_USER_EMAIL: "proxcloud-bot@example.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML python-dotenv

      - name: Fetch fixtures
        run: |
          mkdir -p tmp/raw tmp/sanitized
          python scripts/fetch_production_fixtures.py --output tmp/raw

      - name: Sanitize fixtures
        run: |
          python scripts/sanitize_fixtures.py --input tmp/raw --output tmp/sanitized

      - name: Commit sanitized fixtures and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          BRANCH="fixtures-update-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          rsync -a --delete tmp/sanitized/ tests/production_fixtures/
          git add tests/production_fixtures/
          if git diff --cached --quiet; then
            echo "No changes to fixtures"
            exit 0
          fi
          git commit -m "Update sanitized fixtures"
          # ensure we push using the provided GITHUB_TOKEN
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push --set-upstream origin "$BRANCH"

          # Create a pull request using the create-pull-request action.
          echo "Creating PR against main from $BRANCH"
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          # use the workflow GITHUB_TOKEN path
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fixtures-update-${{ github.run_id }}
          base: main
          title: "Update sanitized fixtures (fixtures-update-${{ github.run_id }})"
          body: "Automated update of sanitized fixtures from workflow run ${{ github.run_id }}. Please review before merging."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
