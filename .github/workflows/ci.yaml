name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest pytest-cov python-dotenv requests PyYAML
      - name: Run tests with coverage via uv
        run: |
          uv run -- python -m pytest --cov=src --cov-fail-under=90 -q
      - name: Lint (basic)
        run: |
          python -m pyflakes src || true
