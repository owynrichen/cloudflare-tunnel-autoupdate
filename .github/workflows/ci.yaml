name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest pytest-cov python-dotenv requests PyYAML
      - name: Run tests with coverage via uv
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          # Run pytest explicitly against the tests/ directory to avoid any
          # discovery differences introduced by the CI environment or
          # editable installs. Keeping PYTHONPATH ensures imports resolve to
          # the source tree.
          # Debug: gather environment and interpreter information to help
          # diagnose differences between local and CI test collection.
          echo "== PYTHON INFO =="
          python -V
          which python || true
          which pip || true
          python -m site
          echo "== PIP LIST =="
          pip list --format=columns || true
          echo "== REPO ROOT AND LISTING =="
          pwd
          echo "== LS ROOT =="
          ls -la || true
          echo "== LS TESTS =="
          ls -la tests || true

          echo "== GIT STATUS =="
          git status --porcelain --untracked-files=all || true

          echo "== SYS.PATH (outside uv) =="
          python -c "import sys, pprint; pprint.pprint(sys.path)"

          echo "== SYS.PATH (inside uv) =="
          uv run -- python -c "import sys, pprint; pprint.pprint(sys.path)"

          # Debug: run the mapping and proxmox_api tests explicitly (verbose)
          # Do NOT ignore failures here so that CI log output contains full
          # tracebacks if collection or imports fail. This helps diagnose why
          # these tests appear to be omitted in CI runs.
          uv run -- python -m pytest tests/test_mapping.py -vv
          uv run -- python -m pytest tests/test_proxmox_api.py -vv
          uv run -- python -m pytest tests --cov=src --cov-fail-under=90 -q
      - name: Lint (basic)
        run: |
          python -m pyflakes src || true
