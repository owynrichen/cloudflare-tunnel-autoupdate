[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest]
addopts = ["-q"]

[project]
name = "proxcloud"
version = "0.1.0"
dependencies = [
  "requests>=2.0",
  "python-dotenv>=0.21",
  "pyyaml>=6.0",
  "pytest>=9.1.1",
  "pytest-cov>=4.0",
]

[tool.uv]
# NOTE: we intentionally do NOT add non-standard keys under [tool.uv] because
# uv will parse this file and reject unknown fields. To enable the local
# pre-commit hooks, run:
#
#   git config core.hooksPath .githooks
#
# We keep the instructions here but do not add a hooks-dir key to avoid
# unexpected TOML parse warnings in CI.
