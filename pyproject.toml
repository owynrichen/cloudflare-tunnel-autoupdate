[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest]
addopts = ["-q"]

[project]
name = "proxcloud"
version = "0.1.0"
dependencies = [
  "requests>=2.0",
  "python-dotenv>=0.21",
  "pyyaml>=6.0",
  "pytest>=9.1.1",
  "pytest-cov>=4.0",
]

[tool.uv]
# Directory containing project-local git hooks. We use this so contributors can
# enable the pre-commit hook by running: git config core.hooksPath .githooks
hooks-dir = ".githooks"
